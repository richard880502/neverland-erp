name: Validate Prisma 7 migration

on:
  push:
    branches:
      - dependabot/npm_and_yarn/prisma-7.10.0

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neverland_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neverland_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neverland_test
      NEXT_PUBLIC_APP_URL: https://erp.example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run build
