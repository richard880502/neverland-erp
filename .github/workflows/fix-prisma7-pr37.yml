name: Fix Prisma 7 PR 37

on:
  push:
    branches:
      - dependabot/npm_and_yarn/prisma-7.10.0

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neverland_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neverland_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neverland_test
      NEXT_PUBLIC_APP_URL: https://erp.example.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/prisma-7.10.0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply Prisma 7 compatibility migration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["dependencies"]["@prisma/client"] = "7.10.0"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")

          config_path = Path("prisma.config.ts")
          config_path.write_text('''import "dotenv/config";\nimport { defineConfig, env } from "prisma/config";\n\nexport default defineConfig({\n  schema: "prisma/",\n  migrations: {\n    path: "prisma/migrations",\n    seed: "tsx prisma/seed.ts",\n  },\n  datasource: {\n    url: env("DATABASE_URL"),\n  },\n});\n''')

          schema_path = Path("prisma/schema.prisma")
          schema = schema_path.read_text()
          schema = schema.replace('generator client {\n  provider = "prisma-client-js"\n}', 'generator client {\n  provider   = "prisma-client-js"\n  engineType = "library"\n}')
          schema = schema.replace('  url      = env("DATABASE_URL")\n', '')
          schema_path.write_text(schema)
          PY
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated migration
        run: |
          rm .github/workflows/fix-prisma7-pr37.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json prisma.config.ts prisma/schema.prisma .github/workflows/fix-prisma7-pr37.yml
          git commit -m "fix(prisma): complete Prisma 7 compatibility migration"
          git push origin HEAD:dependabot/npm_and_yarn/prisma-7.10.0
