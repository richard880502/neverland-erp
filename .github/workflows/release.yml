name: Publish release

# A release is an explicit operator action, not an automatic follow-up to CI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish, e.g. v3.0.6 (must match package.json)"
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and successful main checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Select the main branch in Run workflow."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be vMAJOR.MINOR.PATCH."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" || "$package_version" != "$lock_version" ]]; then
            echo "::error::The requested tag must match package.json and package-lock.json."
            exit 1
          fi

          remote_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$GITHUB_SHA" != "$remote_main_sha" ]]; then
            echo "::error::main advanced since this run started. Start a fresh run on main."
            exit 1
          fi

          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
          for name in test security container analyze Coolify; do
            if ! jq -e --arg name "$name" '
              [.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length > 0
            ' <<<"$checks" >/dev/null; then
              echo "::error::Required main check '$name' has not succeeded."
              exit 1
            fi
          done

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi

          awk -v tag="$RELEASE_TAG" '
            index($0, "## " tag " ") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' README.md > "$RUNNER_TEMP/release-notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::README.md must include a non-empty '## $RELEASE_TAG' release section."
            exit 1
          fi

      - name: Create Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --refs --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing tag $RELEASE_TAG points at $tag_sha, not $GITHUB_SHA."
              exit 1
            fi
            echo "Existing tag points to this commit; resuming release creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

          release_url="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          echo "Published $RELEASE_TAG: $release_url" >> "$GITHUB_STEP_SUMMARY"
