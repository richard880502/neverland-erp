name: Install Prisma PostgreSQL adapter

on:
  push:
    branches:
      - dependabot/npm_and_yarn/prisma-7.10.0

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/prisma-7.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --save @prisma/adapter-pg@7.10.0 pg
      - run: npm install --save-dev @types/pg
      - name: Commit dependencies
        run: |
          rm .github/workflows/install-prisma-pg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/install-prisma-pg.yml
          git commit -m "fix(prisma): add PostgreSQL driver adapter"
          git push origin HEAD:dependabot/npm_and_yarn/prisma-7.10.0
