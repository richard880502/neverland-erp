name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neverland_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neverland_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neverland_test
      NEXT_PUBLIC_APP_URL: https://erp.example.com
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Generate Prisma Client
        run: npx prisma generate
      - run: npm test
      - name: MCP ↔ ERP API parity contract (blocks merges on drift)
        run: npm run test:parity
      - run: npm run test:integration
      - run: python3 -m py_compile scripts/render-billing-template.py
      - name: Validate billing XLSX template
        run: |
          python3 - <<'PY'
          import zipfile

          path = "public/templates/Neverland請款單.xlsx"
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              assert "[Content_Types].xml" in names, "missing XLSX content types"
              assert "xl/workbook.xml" in names, "missing workbook.xml"
              assert any(name.startswith("xl/drawings/") and name.endswith(".xml") for name in names), "missing billing drawing"
              assert any(name.startswith("xl/media/") for name in names), "missing company stamp/media"
          print("billing XLSX template is a valid archive with drawing/media")
          PY
      # LibreOffice fallback retirement tracked in #84.
      # Keep template inspection; heavy UNO end-to-end test is disabled until
      # the legacy PDF/XLSX export endpoints and UI are retired.
      - run: npm run lint
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Block known critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: neverland-erp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the production image and verify its health endpoint
        run: |
          docker run --detach --name neverland-erp-ci --publish 3000:3000 --entrypoint node neverland-erp:ci server.js
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs neverland-erp-ci
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm --force neverland-erp-ci || true
