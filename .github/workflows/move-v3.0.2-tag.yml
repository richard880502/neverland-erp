name: Move v3.0.2 tag to latest main

on:
  push:
    branches:
      - fix/google-sheet-adjustment-sync
    paths:
      - .github/workflows/move-v3.0.2-tag.yml

permissions:
  contents: write

jobs:
  move-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move v3.0.2 to latest main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags --force
          TARGET_SHA="$(git rev-parse origin/main)"
          echo "Moving v3.0.2 to ${TARGET_SHA}"
          git tag -f -a v3.0.2 "$TARGET_SHA" -m "v3.0.2"
          git push --force origin refs/tags/v3.0.2
