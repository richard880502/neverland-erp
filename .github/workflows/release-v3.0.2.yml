name: Release v3.0.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v3.0.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v3.0.2 tag
        env:
          RELEASE_SHA: 5667cb933c905b5c517979b231418acf73a9a8dc
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v3.0.2 >/dev/null 2>&1; then
            echo "v3.0.2 tag already exists"
          else
            git tag -a v3.0.2 "$RELEASE_SHA" -m "v3.0.2"
            git push origin v3.0.2
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 5667cb933c905b5c517979b231418acf73a9a8dc
        run: |
          set -euo pipefail
          if gh release view v3.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v3.0.2 release already exists"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## v3.0.2 — Billing statements and Google Sheets workflow

          This release adds the Neverland billing workflow for consignment and buyout channels.

          - Add BillingStatement / BillingStatementItem billing snapshots.
          - Auto-fill billing suggestions by customer and date period while keeping manual editing available.
          - Calculate settlement price, subtotal, tax, shipping fee, and total receivable.
          - Generate monthly statement numbers such as `BL-202608-001` and `BL-202609-001`.
          - Add a `Google 試算表` action that duplicates the existing `Neverland請款單` → `範本` tab, fills ERP billing data, and opens the generated `BL-...` tab directly.
          - Reopen existing `BL-...` tabs without overwriting manual Google Sheets edits.
          - Insert extra item rows in Google Sheets when a statement exceeds the 15-row template area.
          - Keep PostgreSQL as the billing source of truth; Google Sheets is the document/editing layer.
          - Keep direct XLSX / PDF export as a LibreOffice UNO fallback.

          Follow-up XLSX/PDF layout polish is tracked in #15.
          EOF
          gh release create v3.0.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "v3.0.2 — Billing statements and Google Sheets workflow" \
            --notes-file /tmp/release-notes.md
