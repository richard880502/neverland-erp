name: Refresh Prisma 7 lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/prisma-7.10.0

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/prisma-7.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          rm .github/workflows/refresh-prisma-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-prisma-lock.yml
          git commit -m "fix(prisma): refresh lockfile for Prisma Client 7.10.0"
          git push origin HEAD:dependabot/npm_and_yarn/prisma-7.10.0
