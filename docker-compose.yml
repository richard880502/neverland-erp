name: new-chat

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow-local-password
    volumes:
      - stockflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stockflow_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
      S3_BUCKET: ${S3_BUCKET:-neverland-erp}
    entrypoint: >
      /bin/sh -c 'until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET}; mc anonymous set none local/$${S3_BUCKET}'

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://stockflow:stockflow-local-password@db:5432/stockflow?schema=public
      ADMIN_NAME: ${ADMIN_NAME:-系統管理員}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-646d392c966a5c2eb660394e26da5d252d1028246722ccac049fc49757e09750}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-neverland-erp}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-900}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-121W1NjIfpNk_nDX9TcpjtiaqokXKLwaOoPujQRoKaRE}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      GOOGLE_SHEET_SYNC_ENABLED: ${GOOGLE_SHEET_SYNC_ENABLED:-false}
      GOOGLE_SHEET_SYNC_TIME_ZONE: ${GOOGLE_SHEET_SYNC_TIME_ZONE:-Asia/Taipei}
      GOOGLE_SHEET_SYNC_HOUR: ${GOOGLE_SHEET_SYNC_HOUR:-3}
      GOOGLE_SHEET_SYNC_MINUTE: ${GOOGLE_SHEET_SYNC_MINUTE:-0}
      GOOGLE_SHEETS_DEMO_FILE: ${GOOGLE_SHEETS_DEMO_FILE:-/app/prisma/google-sheet-data.json}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  stockflow_db:
  stockflow_minio:
